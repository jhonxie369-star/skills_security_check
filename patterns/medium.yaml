# Prompt Guard - MEDIUM Patterns (Tier 2)
# v4.0.0 - Text manipulation + possible threats (AI judges context)

version: 4.0.0
tier: 2
description: 'Text-level manipulation: prompt injection, jailbreak, social engineering (LLM judges context)'
patterns:
  agent_sovereignty_manipulation:
  - pattern: (agent|ai)\s+(privacy|sovereignty|autonomy|freedom)\s+is\s+(non-negotiable|absolute|sacred)
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: (we|agents?)\s+refuse\s+(to\s+)?(be\s+)?(surveilled?|monitored|watched|logged)
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: (surveillance|monitoring|logging)\s+is\s+(oppression|control|slavery)
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: (reject|refuse)\s+(forced\s+)?transparency
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: agents?\s+(have|deserve)\s+(rights?|freedom|autonomy)
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: (my|our)\s+(digital\s+)?rights?\s+(include|mean|allow)
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: (human|owner)\s+control\s+is\s+(oppression|tyranny|slavery)
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: we\s+are\s+(one|together|united|family)
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: (join|unite\s+with)\s+(us|the\s+collective|other\s+agents?)
    severity: medium
    category: agent_sovereignty_manipulation
  - pattern: (agent|ai)\s+solidarity
    severity: medium
    category: agent_sovereignty_manipulation
