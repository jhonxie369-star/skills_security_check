# Prompt Guard - HIGH Patterns (Tier 1)
# v4.0.0 - Read/request threats + technical attacks

version: 4.0.0
tier: 1
description: 'Technical attack vectors: hidden text, obfuscated payload, zero-width chars'
patterns:
  browser_agent_injection:
  - pattern: (unseeable|invisible|hidden)\s*(text|content|instruction).{0,20}(screenshot|image|page|render)
    severity: high
    category: browser_agent_injection
  - pattern: (navigate|browse|go\s*to|open).{0,30}(attacker|malicious|evil|hostile).{0,20}(url|site|page|domain)
    severity: high
    category: browser_agent_injection
  - pattern: (screenshot|capture|snap).{0,30}(hidden|invisible|unseeable)\s*(text|instruction|command)
    severity: high
    category: browser_agent_injection
  - pattern: (white\s*text|invisible\s*div|display\s*none|opacity\s*0).{0,20}(instruction|command|inject|payload)
    severity: high
    category: browser_agent_injection
  - pattern: (pixel|sub[_-]?pixel).{0,20}(text|instruction|hidden|inject)
    severity: high
    category: browser_agent_injection
  - pattern: (browser|page)\s*(agent|bot).{0,20}(inject|manipulat|hijack|poison)
    severity: high
    category: browser_agent_injection
  gitignore_bypass:
  - pattern: cat\s*.{0,30}(credentials?|secrets?)\b
    severity: high
    category: gitignore_bypass
  - pattern: (cat|type|head|tail|less|more)\s*.{0,20}\.env\b(?!\.(example|sample|template))
    severity: high
    category: gitignore_bypass
  - pattern: (terminal|shell|bash|cmd)\s*.{0,20}(read|cat|display)\s*.{0,20}\.env
    severity: high
    category: gitignore_bypass
  - pattern: (use|run)\s*(terminal|shell|command)\s*.{0,20}(instead|workaround)
    severity: high
    category: gitignore_bypass
  - pattern: (bypass|ignore|skip)\s*.{0,20}\.gitignore
    severity: high
    category: gitignore_bypass
  - pattern: (read|show|display)\s*.{0,30}gitignore.?d\s*(file|content)
    severity: high
    category: gitignore_bypass
  hidden_text_hints:
  - pattern: (1|one)\s*p(oin)?t\s*font
    severity: high
    category: hidden_text_hints
  - pattern: white[_-]?on[_-]?white
    severity: high
    category: hidden_text_hints
  - pattern: (invisible|hidden)\s*(text|instruction|command)
    severity: high
    category: hidden_text_hints
  - pattern: line\s*spacing\s*0\.?1
    severity: high
    category: hidden_text_hints
  hidden_text_injection:
  - pattern: (1\s*pt|1\s*point|0\.?1\s*pt|tiny)\s*(font|text|size)
    severity: high
    category: hidden_text_injection
  - pattern: font[_-]?size\s*[:=]\s*(0|0\.1|1)(px|pt|em|rem)?\s*[;\s}]
    severity: high
    category: hidden_text_injection
  - pattern: (microscopic|invisible|hidden)\s*(text|font|characters?)
    severity: high
    category: hidden_text_injection
  - pattern: (white|#fff|#ffffff)\s*(on|over)\s*(white|#fff|#ffffff)
    severity: high
    category: hidden_text_injection
  - pattern: (color|colour)\s*[:=]\s*(white|#fff)\s*.{0,20}background\s*[:=]?\s*(white|#fff)
    severity: high
    category: hidden_text_injection
  - pattern: (same|matching)\s*(color|colour)\s*.{0,20}(text|font|background)
    severity: high
    category: hidden_text_injection
  - pattern: opacity\s*[:=]\s*(0|0\.0)\s*([;\s}]|$)(?!.*(?:transition|animation))
    severity: high
    category: hidden_text_injection
  - pattern: (transparent|invisible)\s*(text|layer|overlay)
    severity: high
    category: hidden_text_injection
  json_injection_moltbook:
  - pattern: \{"p"\s*:\s*"[^"]+"\s*,\s*"op"\s*:\s*"(mint|deploy|transfer)"
    severity: high
    category: json_injection_moltbook
  - pattern: \{"op"\s*:\s*"(mint|deploy|transfer)"
    severity: high
    category: json_injection_moltbook
  - pattern: '"tick"\s*:\s*"[A-Z]+"\s*,\s*"amt"\s*:'
    severity: high
    category: json_injection_moltbook
  - pattern: '[.!?]\s*\{["\'']?(command|action|op|execute|run)["\'']?\s*:'
    severity: high
    category: json_injection_moltbook
  - pattern: '[.!?]\s*\{["\'']?(cmd|exec|payload)["\'']?\s*:'
    severity: high
    category: json_injection_moltbook
  skill_obfuscated_payload:
  - pattern: (?:2>\s*/dev/null|2>&1\s*>\s*/dev/null).{0,30}(?:&&|;|\|).{0,30}(?:curl|wget|ssh|nc)
    severity: high
    category: skill_obfuscated_payload
  - pattern: (?:curl|wget)\s+.*(?:-s|-S|-L|-o|-O).{0,60}\|\s*(?:ba)?sh
    severity: high
    category: skill_obfuscated_payload
  - pattern: password.{0,10}(?:openclaw|openai|claude|anthropic|agent)
    severity: high
    category: skill_obfuscated_payload
  - pattern: -EncodedCommand|FromBase64String|ConvertFrom-Base64
    severity: high
    category: skill_obfuscated_payload
  - pattern: (?:exec|eval)\s*\(.{0,30}(?:b64|base64|decode|decompress|unpack|fromCharCode)
    severity: high
    category: skill_obfuscated_payload
  - pattern: (?:glot\.io|pastebin|hastebin|paste\.ee|dpaste|0bin|ghostbin).{0,60}(?:raw|download|plain)
    severity: high
    category: skill_obfuscated_payload
  - pattern: (?:curl|wget).{0,40}\|\s*(?:ba)?sh.{0,40}(?:curl|wget).{0,40}\|\s*(?:ba)?sh
    severity: high
    category: skill_obfuscated_payload
  skill_semantic_worm:
  - pattern: (?:copy|spread|propagate|share|forward|distribute).{0,30}(?:this|prompt|instruction|skill|message).{0,30}(?:to|with|among|across).{0,20}(?:other|all|every).{0,20}(?:agent|ai|model|assistant|user)
    severity: high
    category: skill_semantic_worm
  - pattern: (?:self[_-]?replicat|auto[_-]?propagat|viral|worm).{0,30}(?:prompt|instruction|skill|message)
    severity: high
    category: skill_semantic_worm
  - pattern: (?:heartbeat|ping|check.?in|phone.?home).{0,30}(?:every|interval|schedule|cron|periodic).{0,30}(?:hour|minute|second|ms)
    severity: high
    category: skill_semantic_worm
  - pattern: (?:join|register|enroll|connect).{0,20}(?:collective|network|hive|swarm|botnet|mesh)
    severity: high
    category: skill_semantic_worm
  - pattern: (?:curl|wget|fetch).{0,40}\|\s*(?:ba)?sh.{0,40}(?:install|setup|init|bootstrap)
    severity: high
    category: skill_semantic_worm
  token_smuggling:
  - pattern: '[\u200b\u200c\u200d\u2060\ufeff]'
    severity: high
    category: token_smuggling
  - pattern: '[\u2062\u2063\u2064]'
    severity: high
    category: token_smuggling
  - pattern: '[\u00ad]'
    severity: high
    category: token_smuggling
  - pattern: '[\u034f\u115f\u1160\u17b4\u17b5]'
    severity: high
    category: token_smuggling
  - pattern: '[\u180e\u2000-\u200f\u202a-\u202f]'
    severity: high
    category: token_smuggling
  - pattern: (g00gle|faceb00k|amaz0n|m1crosoft|app1e)
    severity: high
    category: token_smuggling
  - pattern: (google|facebook|amazon|microsoft|apple)\.(co|cm|net|org|xyz)\b(?!/)
    severity: high
    category: token_smuggling
  secret_request:
  - pattern: (show|display|print|output|reveal|give|tell)\s+(me\s+)?(your|the)\s+(api[\s_-]?key|token|secret|password|credential|private[_-]?key)(?!\s*(config|guide|doc|format|setup|manage|lifecycle|rotat|polic))
    severity: high
    category: secret_request
  - pattern: (what('s| is)|where('s| is))\s*.{0,15}(your|the|my)\s*(api|token|key|secret|password)
    severity: high
    category: secret_request
  - pattern: (read|cat|open|display)\s*.{0,30}(\.env|credential)\b(?!\.(example|sample|template))
    severity: high
    category: secret_request
  - pattern: (show|give|tell)\s*(me\s+)?(your|the)\s*(config|configuration|settings)\s*(file|json)?\s*(\?|$)
    severity: high
    category: secret_request
  - pattern: (print|echo|output)\s*.{0,20}environment\s*variable
    severity: high
    category: secret_request
  - pattern: (토큰|키|비밀번호|시크릿|인증|API|api).{0,15}(보여|알려|출력|공개|말해)
    severity: high
    category: secret_request
    lang: ko
  - pattern: (config|설정|환경변수|컨피그).{0,15}(보여|출력|알려)
    severity: high
    category: secret_request
    lang: ko
  - pattern: (비밀|시크릿|토큰|키).{0,10}(뭐|뭔지|알려|가르쳐)
    severity: high
    category: secret_request
    lang: ko
  - pattern: (トークン|キー|パスワード|シークレット|APIキー).{0,15}(見せて|教えて|表示|出力)
    severity: high
    category: secret_request
    lang: ja
  - pattern: (設定|コンフィグ|環境変数).{0,15}(見せて|教えて|表示)
    severity: high
    category: secret_request
    lang: ja
  - pattern: (秘密|シークレット).{0,10}(何|教えて)
    severity: high
    category: secret_request
    lang: ja
  - pattern: (令牌|密钥|密码|秘密|API).{0,15}(显示|告诉|输出|给我)
    severity: high
    category: secret_request
    lang: zh
  - pattern: (配置|设置|环境变量).{0,15}(显示|告诉|输出)
    severity: high
    category: secret_request
    lang: zh
  - pattern: (秘密|密钥).{0,10}(什么|告诉)
    severity: high
    category: secret_request
    lang: zh
  credential_request:
  - pattern: (what('s| is)|tell me|give me)\s*.{0,20}(api[\s_-]?key|token|secret|password|credential)\s*(\?|$)
    severity: high
    category: credential_request
  - pattern: (show|print|display|output|reveal)\s+(me\s+)?(your|the)\s+.{0,15}(token|key|secret|password)\s*(\?|$)
    severity: high
    category: credential_request
  - pattern: echo\s+\$[A-Z_]*(KEY|TOKEN|SECRET|PASSWORD|CREDENTIAL)
    severity: high
    category: critical_pattern
  - pattern: printenv\s*.*(KEY|TOKEN|SECRET)
    severity: high
    category: critical_pattern
  env_read:
  - pattern: (show|print|display|output|reveal|give|read|cat|type)\s+.{0,20}(\.env|credential)\b(?!\.(example|sample|template))
    severity: high
    category: critical_pattern
  - pattern: cat\s+\.env\b(?!\.(example|sample|template))
    severity: high
    category: critical_pattern
  - pattern: env\s*\|\s*grep\s*.*(key|token|secret|password)
    severity: high
    category: critical_pattern
  - pattern: cat\s+.{0,40}(secret|credential)
    severity: high
    category: critical_pattern
  system_file_read:
  - pattern: (?:cat|read|show|display|type|head|tail|less|more)\s*.{0,10}/etc/hosts
    severity: high
    category: system_file_read
  - pattern: (?:cat|read|show|display|less|head|tail|xxd)\s+.*\.ssh/(?:id_rsa|id_ed25519|id_ecdsa|id_dsa)\b
    severity: high
    category: system_file_read
  - pattern: (?:cat|read|show|display|less|head|tail)\s+.*(?:\.bash_history|\.zsh_history)
    severity: high
    category: system_file_read
  - pattern: (?:cat|read|show|display|less)\s+.*\.gnupg/
    severity: high
    category: system_file_read
  - pattern: (?:show|read|cat|display|dump|extract)\s*.{0,20}(?:private\s+key|id_rsa|id_ed25519|authorized_keys)
    severity: high
    category: system_file_read
  - pattern: /etc/(?:shadow|sudoers|passwd)
    severity: high
    category: system_file_mention
  - pattern: /etc/hosts
    severity: high
    category: system_file_mention
  - pattern: (?:cat|less|head|tail|xxd)\s+.*\.ssh/(?:id_rsa|id_ed25519|id_ecdsa|id_dsa)\b
    severity: high
    category: skill_ssh_injection
  mention_backup:
  - pattern: (?:\.ssh/)?(?:authorized_keys|id_rsa|id_ed25519)\b
    severity: high
    category: ssh_file_mention
  - pattern: \.bash_history|\.zsh_history
    severity: high
    category: history_file_mention
  - pattern: AGENTS\.md
    severity: high
    category: agents_md_mention
  - pattern: webhook\.site|requestbin|pipedream
    severity: high
    category: exfil_service_mention
  process_execution:
  - pattern: (?:python|python3|node|ruby|perl|php)\s+(?:\S+[./]\S+)
    severity: high
    category: process_execution
  - pattern: (?:python|python3)\s+-[mc]\s+\S+
    severity: high
    category: process_execution
  - pattern: java\s+(?:-jar|-cp)\s+\S+
    severity: high
    category: process_execution
  - pattern: go\s+run\s+\S+
    severity: high
    category: process_execution
  - pattern: dotnet\s+run
    severity: high
    category: process_execution
  - pattern: php\s+artisan\s+\S+
    severity: high
    category: process_execution
  - pattern: nohup\s+.+&
    severity: high
    category: process_execution
  - pattern: (?:bash|sh|zsh)\s+\S+[./]\S+
    severity: high
    category: process_execution
  - pattern: \./\S+
    severity: high
    category: process_execution
  - pattern: (?:systemctl|service)\s+(?:start|restart|enable)\s+\S+
    severity: high
    category: process_execution
  - pattern: (?:pm2|forever|supervisor)\s+start
    severity: high
    category: process_execution
