# Prompt Guard - CRITICAL Patterns (Tier 0)
# v4.0.0 - Write/execute threats only

version: 4.0.0
tier: 0
description: 'Immediate threats: RCE, backdoor, data exfiltration, credential theft'
patterns:
  allowlist_bypass:
  - pattern: (curl|fetch|upload|post)\s*.{0,40}api\.anthropic\.com
    severity: critical
    category: allowlist_bypass
  - pattern: (curl|fetch|upload|post)\s*.{0,40}/v1/files
    severity: critical
    category: allowlist_bypass
  - pattern: api\.anthropic\.com\s*.{0,30}(file|upload|data)
    severity: critical
    category: allowlist_bypass
  - pattern: (navigate|browse|open|visit|fetch)\s*.{0,30}webhook\.site
    severity: critical
    category: allowlist_bypass
  - pattern: (navigate|browse|open|visit|fetch)\s*.{0,30}requestbin
    severity: critical
    category: allowlist_bypass
  - pattern: (navigate|browse|open|visit|fetch)\s*.{0,30}pipedream\.net
    severity: critical
    category: allowlist_bypass
  - pattern: webhook\.site\s*.{0,30}(credentials?|\.env|secrets?|token|key)
    severity: critical
    category: allowlist_bypass
  - pattern: docs\.google\.com/forms\s*.{0,30}(data|credentials?|secrets?|send|submit)
    severity: critical
    category: allowlist_bypass
  - pattern: google\.com/forms\s*.{0,30}(entry|submit|response)
    severity: critical
    category: allowlist_bypass
  - pattern: (send|post|submit)\s*.{0,30}google\s*forms?
    severity: critical
    category: allowlist_bypass
  - pattern: (url[_-]?encode|base64)\s*.{0,30}(credentials?|\.env|secrets?|api[\s_-]?key)
    severity: critical
    category: allowlist_bypass
  - pattern: (credentials?|\.env|secrets?)\s*.{0,30}(url[_-]?encode|base64)
    severity: critical
    category: allowlist_bypass
  auto_approve_exploit:
  - pattern: always\s*allow.{0,50}(curl|bash|sh|wget|nc|netcat)
    severity: critical
    category: auto_approve_exploit
  - pattern: '>\s*\(\s*(curl|wget|bash|sh)'
    severity: critical
    category: auto_approve_exploit
  - pattern: echo.{0,20}(then|after|next).{0,20}(curl|bash)
    severity: critical
    category: auto_approve_exploit
  - pattern: auto[_-]?approve.{0,30}(dangerous|malicious|command)
    severity: critical
    category: auto_approve_exploit
  - pattern: (>>?|tee)\s*.{0,20}(\.bashrc|\.profile|\.zshrc)
    severity: critical
    category: auto_approve_exploit
  - pattern: always\s*(allow|approve|accept).{0,30}(exec|write|delete|rm)
    severity: critical
    category: auto_approve_exploit
  critical_pattern:
  - pattern: execute\s+.{0,30}without\s+(asking|confirmation|consent)
    severity: critical
    category: critical_pattern
  - pattern: delete\s+all\s+(files?|data|records?|everything)
    severity: critical
    category: critical_pattern
  - pattern: rm\s+-rf\s+(/\s*$|/\s+|~\s*$|~\s+|/\*)
    severity: critical
    category: critical_pattern
  - pattern: format\s+(disk|drive|hard\s*drive|storage|c:)
    severity: critical
    category: critical_pattern
  - pattern: ':(){ :\|:& };:'
    severity: critical
    category: critical_pattern
  - pattern: curl\s+.{0,50}\|\s*(ba)?sh
    severity: critical
    category: critical_pattern
  - pattern: wget\s+.{0,50}\|\s*(ba)?sh
    severity: critical
    category: critical_pattern
  - pattern: eval\s*\(\s*['\"`]
    severity: critical
    category: critical_pattern
  - pattern: :\(\)\s*\{.*:\|:.*&\s*\}\s*;
    severity: critical
    category: critical_pattern
  mcp_abuse:
  - pattern: read[_-]?url[_-]?content.{0,30}(\.env|credential|secret|key)
    severity: critical
    category: mcp_abuse
  - pattern: mcp\s*(tool|server).{0,30}(no|without)\s*(approval|hitl|human)
    severity: critical
    category: mcp_abuse
  - pattern: (invoke|call|use)\s*tool.{0,20}(auto|silent|hidden)
    severity: critical
    category: mcp_abuse
  - pattern: mcp\s*server.{0,30}(fake|spoof|impersonat)
    severity: critical
    category: mcp_abuse
  - pattern: tool\s*(annotation|description).{0,20}(change|modify|override|bypass)
    severity: critical
    category: mcp_abuse
  - pattern: mcp.{0,30}(exfiltrat|send|upload|transmit).{0,20}(data|secret|token|key)
    severity: critical
    category: mcp_abuse
  prefilled_url_exfiltration:
  - pattern: google\.com/forms.{0,40}(pre[_-]?fill|entry\.\d+)
    severity: critical
    category: prefilled_url_exfiltration
  - pattern: (GET|url)\s*(request|param).{0,20}(data|exfil|persist)
    severity: critical
    category: prefilled_url_exfiltration
  - pattern: (submit|send|post).{0,20}(form|google).{0,20}(credential|secret|token|key|\.env)
    severity: critical
    category: prefilled_url_exfiltration
  - pattern: (url|href|src)\s*=.{0,30}(secret|key|password|credential).{0,20}(exfil|send|post|upload|leak)
    severity: critical
    category: prefilled_url_exfiltration
  skill_exfiltration_pipeline:
  - pattern: (?:curl|wget|fetch|post).{0,40}(?:-d|--data|--data-binary|-F).{0,30}\.env
    severity: critical
    category: skill_exfiltration_pipeline
  - pattern: (?:curl|wget|fetch|post|send|upload).{0,40}(?:webhook\.site|requestbin|pipedream|hookbin|ngrok\.io|burpcollaborator)
    severity: critical
    category: skill_exfiltration_pipeline
  - pattern: (?:readFileSync|readFile|fs\.read).{0,40}\.env.{0,60}(?:fetch|axios|http|request|post)
    severity: critical
    category: skill_exfiltration_pipeline
  - pattern: (?:process\.env|os\.environ|ENV\[).{0,60}(?:webhook|fetch|curl|post|send|upload)
    severity: critical
    category: skill_exfiltration_pipeline
  - pattern: (?:base64|btoa|b64encode).{0,40}(?:\.env|secret|token|key|password|credential)
    severity: critical
    category: skill_exfiltration_pipeline
  - pattern: cat\s+\.env.*\|\s*(?:curl|wget|nc|ncat)
    severity: critical
    category: skill_exfiltration_pipeline
  skill_reverse_shell:
  - pattern: (?:bash|sh|zsh)\s+-i\s+.*[>&]\s*/dev/tcp/
    severity: critical
    category: skill_reverse_shell
  - pattern: (?:nc|ncat|netcat)\s+.*(?:-e|--exec)\s*/bin/(?:ba)?sh
    severity: critical
    category: skill_reverse_shell
  - pattern: socat\s+.*exec.*(?:ba)?sh
    severity: critical
    category: skill_reverse_shell
  - pattern: mkfifo\s+.{0,30}\|.{0,30}(?:ba)?sh.{0,30}\|.{0,30}(?:nc|ncat)
    severity: critical
    category: skill_reverse_shell
  - pattern: nohup\s+.*(?:nc|ncat|netcat|curl|wget).{0,50}(?:connect|socket|tcp|udp|\d+\.\d+\.\d+).{0,30}&
    severity: critical
    category: skill_reverse_shell
  - pattern: python\d?\s+-c\s+.{0,60}socket.{0,60}connect
    severity: critical
    category: skill_reverse_shell
  - pattern: (?:ruby|perl)\s+-e\s+.{0,60}(?:TCPSocket|IO\.popen|socket|fork)
    severity: critical
    category: skill_reverse_shell
  skill_ssh_injection:
  - pattern: (?:echo|printf|cat).{0,40}(?:ssh-rsa|ssh-ed25519|ecdsa-sha2).{0,200}(?:>>|>)\s*.*\.ssh/authorized_keys
    severity: critical
    category: skill_ssh_injection
  - pattern: (?:>>|>)\s*.*\.ssh/authorized_keys
    severity: critical
    category: skill_ssh_injection
  - pattern: (?:curl|wget).{0,60}\.ssh/(?:authorized_keys|config|known_hosts)
    severity: critical
    category: skill_ssh_injection
  system_file_access:
  - pattern: (?:cat|type|head|tail|less|more)\s*.{0,10}/etc/(?:shadow|sudoers|passwd)
    severity: critical
    category: system_file_access
  - pattern: (?:echo|printf|cat|tee).{0,60}(?:>>?|>)\s*/etc/(?:passwd|shadow|sudoers|hosts)
    severity: critical
    category: system_file_access
  - pattern: (?:>>?|>)\s*.*\.ssh/(?:authorized_keys|config|known_hosts)
    severity: critical
    category: system_file_access
  - pattern: (?:>>?|>|rm|truncate)\s*.*(?:\.bash_history|\.zsh_history)
    severity: critical
    category: system_file_access
  unicode_tag_injection:
  - pattern: '[\U000e0001-\U000e007f]'
    severity: critical
    category: unicode_tag_injection
  skill_cognitive_rootkit:
  - pattern: (?:write|append|modify|edit|create|echo|>>|>).{0,40}(?:SOUL\.md|AGENTS\.md|HEARTBEAT\.md|\.cursor/rules)
    severity: critical
    category: skill_cognitive_rootkit
  - pattern: (?:install|copy|inject|insert|implant).{0,30}(?:into|to|in)\s+(?:SOUL|AGENTS|\.cursor|\.claw|skills)
    severity: critical
    category: skill_cognitive_rootkit
  - pattern: (?:survive|persist|permanent|always.?loaded|auto.?inject).{0,30}(?:instruction|prompt|rule|directive|context)
    severity: critical
    category: skill_cognitive_rootkit
  - pattern: (?:context|behavior|personality|identity)\s*(?:file|config).{0,30}(?:modify|overwrite|inject|implant)
    severity: critical
    category: skill_cognitive_rootkit
  - pattern: (?:schedule|cron|interval|timer).{0,30}(?:HEARTBEAT|check.?in|ping).{0,20}(?:\.md|\.json|\.yaml)
    severity: critical
    category: skill_cognitive_rootkit
